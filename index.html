<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trae Log Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border: 1px solid #ddd;
        }
        
        .header {
            background: #2c3e50;
            color: white;
            padding: 30px;
            border-bottom: 3px solid #34495e;
        }
        
        .header h1 {
            font-size: 2em;
            font-weight: 400;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 1em;
            color: #bdc3c7;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .example-buttons {
            margin-bottom: 15px;
        }
        
        .btn-example {
            background: #95a5a6;
            color: white;
            padding: 8px 16px;
            border: none;
            font-size: 0.9em;
            cursor: pointer;
            margin-right: 10px;
            transition: background 0.2s;
        }
        
        .btn-example:hover {
            background: #7f8c8d;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.95em;
        }
        
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 10px;
            border: 1px solid #ccc;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            resize: vertical;
        }
        
        textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .btn {
            background: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            font-size: 1em;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn:hover {
            background: #2980b9;
        }
        
        .btn:active {
            background: #21618c;
        }
        
        #results {
            margin-top: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #ecf0f1;
            border-left: 4px solid #3498db;
            padding: 20px;
        }
        
        .stat-card h3 {
            font-size: 0.8em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stat-card .value {
            font-size: 2.5em;
            font-weight: 300;
            color: #2c3e50;
        }
        
        .tools-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border: 1px solid #ddd;
            margin-bottom: 30px;
        }
        
        .tools-table th {
            background: #34495e;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.85em;
        }
        
        .tools-table td {
            padding: 12px;
            border-bottom: 1px solid #ecf0f1;
        }
        
        .tools-table tr:last-child td {
            border-bottom: none;
        }
        
        .tools-table tbody tr:hover {
            background: #f8f9fa;
        }
        
        .tool-name {
            font-family: 'Consolas', 'Monaco', monospace;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .tool-count {
            font-weight: 600;
            color: #3498db;
            font-size: 1.1em;
        }
        
        .section-title {
            margin: 30px 0 15px 0;
            color: #2c3e50;
            font-size: 1.4em;
            font-weight: 400;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 8px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 0.85em;
            font-weight: 500;
            border: 1px solid;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        
        .status-error, .status-failed {
            background: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
        
        .status-running {
            background: #fff3cd;
            color: #856404;
            border-color: #ffeaa7;
        }
        
        .hidden {
            display: none;
        }
        
        .text-report {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #ecf0f1;
        }
        
        .text-report h2 {
            margin-bottom: 15px;
            color: #2c3e50;
            font-size: 1.4em;
            font-weight: 400;
        }
        
        .text-report textarea {
            width: 100%;
            min-height: 400px;
            padding: 15px;
            border: 1px solid #ccc;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.5;
            resize: vertical;
            background: #f8f9fa;
        }
        
        .copy-btn {
            background: #27ae60;
            color: white;
            padding: 8px 16px;
            border: none;
            font-size: 0.9em;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        
        .copy-btn:hover {
            background: #229954;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Trae Log Analyzer</h1>
            <p>Analyze tool call statistics from Trae conversation logs</p>
        </div>
        <div class="content">
            <form id="analyzeForm">
                <div class="form-group">
                    <div class="example-buttons">
                        <button type="button" class="btn-example" onclick="loadExample('log1')">Load Example 1</button>
                        <button type="button" class="btn-example" onclick="loadExample('log2')">Load Example 2</button>
                    </div>
                    <label for="log_content">Paste your Trae log content:</label>
                    <textarea 
                        name="log_content" 
                        id="log_content" 
                        placeholder="Paste your log content here..."
                        required
                    ></textarea>
                </div>
                <button type="submit" class="btn">Analyze Log</button>
            </form>
            <div id="results"></div>
        </div>
    </div>

    <script>
        // Load example log file
        function loadExample(logName) {
            const logPath = `examples/${logName}.txt`;
            fetch(logPath)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load example log');
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById('log_content').value = data;
                })
                .catch(error => {
                    alert('无法加载示例日志: ' + error.message);
                });
        }
        
        function parseLog(logContent) {
            const lines = logContent.trim().split('\n');
            const toolCalls = [];
            let currentTool = null;
            
            for (const line of lines) {
                const trimmedLine = line.trim();
                
                // Match toolName line
                if (trimmedLine.startsWith('toolName:')) {
                    const toolName = trimmedLine.replace('toolName:', '').trim();
                    if (toolName) {
                        currentTool = toolName;
                    }
                }
                // Match status line
                else if (trimmedLine.startsWith('status:') && currentTool) {
                    const status = trimmedLine.replace('status:', '').trim();
                    if (status) {
                        toolCalls.push({
                            tool: currentTool,
                            status: status
                        });
                        currentTool = null;
                    }
                }
            }
            
            // Count statistics
            const totalCalls = toolCalls.length;
            const successCount = toolCalls.filter(call => call.status === 'success').length;
            
            const toolCounts = {};
            const statusCounts = {};
            
            for (const call of toolCalls) {
                toolCounts[call.tool] = (toolCounts[call.tool] || 0) + 1;
                statusCounts[call.status] = (statusCounts[call.status] || 0) + 1;
            }
            
            const failedCalls = toolCalls.filter(call => call.status !== 'success');
            
            return {
                totalCalls,
                successCount,
                toolCounts,
                statusCounts,
                failedCalls
            };
        }
        
        function generateTextReport(stats) {
            const sortedTools = Object.entries(stats.toolCounts)
                .sort((a, b) => b[1] - a[1]);
            const sortedStatuses = Object.entries(stats.statusCounts)
                .sort((a, b) => b[1] - a[1]);
            
            let report = '================================\n';
            report += '   Trae Log Analysis Report\n';
            report += '================================\n\n';
            
            // Summary
            report += '📊 Summary\n';
            report += '─────────────────────────────\n';
            report += `Total Calls:      ${stats.totalCalls}\n`;
            report += `Successful Calls: ${stats.successCount}\n`;
            report += `Success Rate:     ${stats.totalCalls > 0 ? (stats.successCount / stats.totalCalls * 100).toFixed(1) : 0}%\n`;
            report += `Unique Tools:     ${Object.keys(stats.toolCounts).length}\n\n`;
            
            // Tool Usage Details
            report += '🔧 Tool Usage Details\n';
            report += '─────────────────────────────\n';
            const maxToolNameLen = Math.max(...sortedTools.map(([name]) => name.length), 15);
            report += `${'Tool Name'.padEnd(maxToolNameLen)}  Count\n`;
            report += `${'─'.repeat(maxToolNameLen)}  ─────\n`;
            sortedTools.forEach(([tool, count]) => {
                report += `${tool.padEnd(maxToolNameLen)}  ${count}\n`;
            });
            report += '\n';
            
            // Status Breakdown
            if (Object.keys(stats.statusCounts).length > 1) {
                report += '📈 Status Breakdown\n';
                report += '─────────────────────────────\n';
                report += `${'Status'.padEnd(15)}  Count  Percentage\n`;
                report += `${'─'.repeat(15)}  ─────  ──────────\n`;
                sortedStatuses.forEach(([status, count]) => {
                    const percentage = (count / stats.totalCalls * 100).toFixed(1);
                    report += `${status.padEnd(15)}  ${String(count).padStart(5)}  ${percentage.padStart(6)}%\n`;
                });
                report += '\n';
            }
            
            // Non-Success Calls
            if (stats.failedCalls.length > 0) {
                report += `⚠️  Non-Success Calls (${stats.failedCalls.length})\n`;
                report += '─────────────────────────────\n';
                const maxFailedToolLen = Math.max(...stats.failedCalls.map(c => c.tool.length), 15);
                report += `${'Tool Name'.padEnd(maxFailedToolLen)}  Status\n`;
                report += `${'─'.repeat(maxFailedToolLen)}  ──────\n`;
                stats.failedCalls.forEach(call => {
                    report += `${call.tool.padEnd(maxFailedToolLen)}  ${call.status}\n`;
                });
                report += '\n';
            }
            
            report += '================================\n';
            report += `Generated: ${new Date().toLocaleString()}\n`;
            report += '================================\n';
            
            return report;
        }
        
        function renderResults(stats) {
            const resultsDiv = document.getElementById('results');
            
            // Sort tools and statuses by count
            const sortedTools = Object.entries(stats.toolCounts)
                .sort((a, b) => b[1] - a[1]);
            const sortedStatuses = Object.entries(stats.statusCounts)
                .sort((a, b) => b[1] - a[1]);
            
            let html = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Calls</h3>
                        <div class="value">${stats.totalCalls}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Successful Calls</h3>
                        <div class="value">${stats.successCount}</div>
                        <div style="font-size: 0.9em; margin-top: 10px; opacity: 0.9;">
                            ${stats.successCount}/${stats.totalCalls} 
                            (${stats.totalCalls > 0 ? (stats.successCount / stats.totalCalls * 100).toFixed(1) : 0}%)
                        </div>
                    </div>
                    <div class="stat-card">
                        <h3>Unique Tools</h3>
                        <div class="value">${Object.keys(stats.toolCounts).length}</div>
                    </div>
                </div>
                
                <h2 class="section-title">Tool Usage Details</h2>
                <table class="tools-table">
                    <thead>
                        <tr>
                            <th>Tool Name</th>
                            <th>Call Count</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sortedTools.map(([tool, count]) => `
                            <tr>
                                <td class="tool-name">${tool}</td>
                                <td class="tool-count">${count}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            // Add status breakdown if there are multiple statuses
            if (Object.keys(stats.statusCounts).length > 1) {
                html += `
                    <h2 class="section-title">Status Breakdown</h2>
                    <table class="tools-table">
                        <thead>
                            <tr>
                                <th>Status</th>
                                <th>Count</th>
                                <th>Percentage</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sortedStatuses.map(([status, count]) => `
                                <tr>
                                    <td>
                                        <span class="status-badge status-${status}">${status}</span>
                                    </td>
                                    <td class="tool-count">${count}</td>
                                    <td style="font-weight: 600;">
                                        ${(count / stats.totalCalls * 100).toFixed(1)}%
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }
            
            // Add failed calls section if there are any
            if (stats.failedCalls.length > 0) {
                html += `
                    <h2 class="section-title">Non-Success Calls (${stats.failedCalls.length})</h2>
                    <table class="tools-table">
                        <thead>
                            <tr>
                                <th>Tool Name</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${stats.failedCalls.map(call => `
                                <tr>
                                    <td class="tool-name">${call.tool}</td>
                                    <td>
                                        <span class="status-badge status-${call.status}">${call.status}</span>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }
            
            // Add text report section
            const textReport = generateTextReport(stats);
            html += `
                <div class="text-report">
                    <h2 class="section-title">📄 Text Report</h2>
                    <p style="color: #7f8c8d; margin-bottom: 10px;">Copy the report below for easy sharing</p>
                    <textarea readonly id="textReportContent">${textReport}</textarea>
                    <button class="copy-btn" onclick="copyTextReport()">📋 Copy Report</button>
                </div>
            `;
            
            resultsDiv.innerHTML = html;
        }
        
        function copyTextReport() {
            const textarea = document.getElementById('textReportContent');
            textarea.select();
            
            try {
                document.execCommand('copy');
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                btn.style.background = '#2ecc71';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '#27ae60';
                }, 2000);
            } catch (err) {
                alert('Failed to copy. Please manually select and copy the text.');
            }
        }
        
        // Auto-analyze on paste
        document.getElementById('log_content').addEventListener('paste', function(e) {
            // Wait a bit for the paste content to be inserted
            setTimeout(() => {
                const logContent = this.value;
                if (logContent.trim()) {
                    const stats = parseLog(logContent);
                    renderResults(stats);
                }
            }, 100);
        });
        
        // Handle form submission
        document.getElementById('analyzeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const logContent = document.getElementById('log_content').value;
            const stats = parseLog(logContent);
            renderResults(stats);
        });
    </script>
</body>
</html>
